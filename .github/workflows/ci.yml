# CI：core / relay / ui 三条泳道门禁（与 scripts/gate.sh 保持一致）。
#
# shell 泳道（cargo test -p localtrans）需要 Tauri 系统依赖
# （Linux 上为 webkit2gtk 等），暂留在本地 Windows 门禁执行；
# android 泳道依赖 NDK/cargo-ndk 本机工具链，同样留在本地。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: 门禁 core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p localtrans-core

  relay:
    name: 门禁 relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 端口竞争，必须串行（同 gate.sh relay）
      - run: cargo test -p localtrans-relay -- --test-threads=1

  ui:
    name: 门禁 ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
